<style>
  :root { --ink:#FAF9F6; --bg:#141412; --mute:rgba(250,249,246,.55); --line:rgba(250,249,246,.10); --hallo:#ff7a1a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b0b0d; color:var(--ink); overflow:hidden; font-family:"Hanken Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas#c:active { cursor:grabbing; }
  .vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 40% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #hud { position:fixed; left:28px; top:24px; pointer-events:none; }
  #hud .eyebrow { font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.22em; color:var(--mute); text-transform:uppercase; }
  #hud h1 { margin:10px 0 0; font:400 44px/1 "Bodoni Moda",Didot,serif; letter-spacing:.01em; }
  #hud h1 em { font-style:italic; }
  #hud .paintname { margin-top:10px; font:400 13px/1.2 "Hanken Grotesk"; color:var(--mute); }
  #hint { position:fixed; left:28px; bottom:22px; font:400 11px/1 "IBM Plex Mono",monospace; letter-spacing:.14em; color:var(--mute); text-transform:uppercase; pointer-events:none; }
  #panel { position:fixed; right:18px; top:18px; bottom:18px; width:310px; padding:22px 20px; overflow-y:auto; scrollbar-width:none;
    background:rgba(20,20,18,.58); border:1px solid var(--line); border-radius:18px; backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); }
  #panel::-webkit-scrollbar { display:none; }
  #panel h3 { margin:0 0 12px; font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--mute); }
  #panel section { padding:0 0 20px; margin:0 0 20px; border-bottom:1px solid var(--line); }
  #panel section:last-child { border-bottom:0; margin-bottom:0; padding-bottom:0; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; }
  .sw-btn { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.18); cursor:pointer; position:relative; padding:0; outline:none; transition:transform .2s; }
  .sw-btn:hover { transform:scale(1.08); }
  .sw-btn.on::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:1px solid var(--ink); }
  .wheels { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .wh-btn { text-align:left; padding:10px 11px; border-radius:11px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--ink); cursor:pointer; font:500 13px/1.25 "Hanken Grotesk"; transition:all .2s; }
  .wh-btn small { display:block; margin-top:3px; font:400 10px/1 "IBM Plex Mono",monospace; letter-spacing:.08em; color:var(--mute); text-transform:uppercase; }
  .wh-btn:hover { background:rgba(255,255,255,.07); }
  .wh-btn.on { border-color:var(--ink); background:rgba(250,249,246,.10); }
  .tog { display:flex; align-items:center; justify-content:space-between; padding:9px 0; cursor:pointer; user-select:none; font:500 14.5px/1.2 "Hanken Grotesk"; }
  .tog small { display:block; margin-top:3px; font:400 11px/1.2 "Hanken Grotesk"; color:var(--mute); }
  .tog input { display:none; }
  .tog i { flex:none; width:44px; height:25px; border-radius:20px; background:rgba(255,255,255,.12); position:relative; transition:background .25s; }
  .tog i::after { content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#d9d8d4; transition:transform .25s cubic-bezier(.3,1.4,.5,1), background .25s; }
  .tog input:checked + i { background:var(--ink); }
  .tog input:checked + i::after { transform:translateX(19px); background:var(--bg); }
  .tog.hallo input:checked + i { background:var(--hallo); box-shadow:0 0 18px rgba(255,122,26,.55); }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { padding:8px 12px; border-radius:30px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; font:500 12.5px/1 "Hanken Grotesk"; transition:all .2s; }
  .chip:hover { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.3); }
  .snap { width:100%; margin-top:4px; padding:12px; border-radius:12px; border:1px solid var(--ink); background:var(--ink); color:var(--bg); font:600 13px/1 "Hanken Grotesk"; letter-spacing:.04em; cursor:pointer; }
  .snap:hover { opacity:.9; }
  body.hallo #hud h1 { text-shadow:0 0 24px rgba(255,122,26,.45); }
  #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:#0b0b0d; z-index:10; transition:opacity .9s; }
  #loader .mk { font:400 34px/1 "Bodoni Moda",serif; }
  #loader .bar { width:220px; height:1px; background:var(--line); overflow:hidden; }
  #loader .bar b { display:block; height:100%; width:0; background:var(--ink); transition:width .4s; }
  #loader p { margin:0; font:400 11px/1 "IBM Plex Mono",monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--mute); }
  #credit { position:fixed; left:28px; bottom:42px; font:400 10.5px/1.3 "IBM Plex Mono",monospace; color:var(--mute); }
  #credit a { color:var(--mute); }
  #err { position:fixed; left:20px; bottom:60px; max-width:60ch; color:#ff8a8a; font:12px/1.4 "IBM Plex Mono",monospace; white-space:pre-wrap; z-index:20; }
  @media (max-width: 820px) {
    #panel { top:auto; left:10px; right:10px; bottom:10px; width:auto; max-height:42vh; padding:16px; }
    #hud { left:16px; top:14px; } #hud h1 { font-size:30px; } #hint { display:none; }
    #credit { left:16px; bottom:calc(42vh + 18px); font-size:9.5px; }
  }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

window.addEventListener('error', e => { document.getElementById('err').textContent = String(e.message || e); });

/* =========================================================================
   Small helpers
   ========================================================================= */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sstep = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// monotone cubic interpolation (no overshoot) through [x,y] keys
function pchip(keys) {
  const xs = keys.map(k => k[0]), ys = keys.map(k => k[1]), n = xs.length;
  const h = [], m = [], d = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; m[i] = (ys[i + 1] - ys[i]) / h[i]; }
  d[0] = m[0]; d[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) d[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; d[i] = (w1 + w2) / (w1 / m[i - 1] + w2 / m[i]); }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * d[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * d[i + 1];
  };
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  t.userData.canvas = c; t.userData.ctx = ctx;
  return t;
}
const loaderBar = document.getElementById('lbar'), loaderMsg = document.getElementById('lmsg');
const step = (pct, msg) => new Promise(r => { loaderBar.style.width = pct + '%'; loaderMsg.textContent = msg; setTimeout(r, 30); });

/* =========================================================================
   Renderer, scene, camera
   ========================================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 820;
const DPR = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.35 : 1.75);
const RQ = MOBILE ? 0.35 : 0.6;
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0d);
scene.fog = new THREE.FogExp2(0x160c1c, 0.0);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 80);
camera.position.set(9.5, 0.9, 8.0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.055; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8;
controls.minDistance = 1.3; controls.maxDistance = 9.5;
controls.minPolarAngle = 0.08; controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0.1, 0.55, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
controls.screenSpacePanning = true;

/* =========================================================================
   Studio: detailing bay with a honeycomb LED ceiling
   ========================================================================= */
const ROOM = { x: 12, z: 10, h: 4.4 };
const mood = [], blobs = []; // mood: things whose color shifts with Halloween mode
function hdr(c, k) { return new THREE.Color(c).multiplyScalar(k); }

function buildStudio() {
  // Room shell (main + env)
  const wallM = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, roughness: 0.92 });
  const ceilM = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.95 });
  const roomG = new THREE.BoxGeometry(ROOM.x * 2, ROOM.h, ROOM.z * 2);
  const room = new THREE.Mesh(roomG, [wallM, wallM, ceilM, wallM, wallM, wallM]);
  room.material.forEach(m => m.side = THREE.BackSide);
  room.position.y = ROOM.h / 2 - 0.01; scene.add(room);
  const eWall = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 0.07), side: THREE.BackSide });
  const eCeil = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 0.018), side: THREE.BackSide });
  const eFloor = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 0.1), side: THREE.BackSide });
  const eRoom = new THREE.Mesh(roomG, [eWall, eWall, eCeil, eFloor, eWall, eWall]);
  eRoom.position.copy(room.position); envScene.add(eRoom);

  // Honeycomb grid
  const s = 0.5, Y = 3.55, dx = Math.sqrt(3) * s, dz = 1.5 * s;
  const edges = new Map(); let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (let row = -12; row <= 12; row++) for (let col = -12; col <= 12; col++) {
    const cx = col * dx + (row & 1 ? dx / 2 : 0), cz = row * dz;
    if (Math.abs(cx) > 3.7 || Math.abs(cz) > 2.5) continue;
    const v = [];
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; v.push([cx + s * Math.cos(a), cz + s * Math.sin(a)]); }
    for (let k = 0; k < 6; k++) {
      const a = v[k], b = v[(k + 1) % 6];
      minX = Math.min(minX, a[0]); maxX = Math.max(maxX, a[0]); minZ = Math.min(minZ, a[1]); maxZ = Math.max(maxZ, a[1]);
      const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2, key = Math.round(mx * 100) + ',' + Math.round(mz * 100);
      if (!edges.has(key)) edges.set(key, { mx, mz, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) });
    }
  }
  const list = [...edges.values()];
  const barG = new THREE.BoxGeometry(s - 0.03, 0.03, 0.045);
  const hexMain = new THREE.InstancedMesh(barG, new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 2.4) }), list.length);
  const hexEnv = new THREE.InstancedMesh(barG, new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 7) }), list.length);
  const o = new THREE.Object3D();
  list.forEach((e, i) => { o.position.set(e.mx, Y, e.mz); o.rotation.set(0, -e.ang, 0); o.updateMatrix(); hexMain.setMatrixAt(i, o.matrix); hexEnv.setMatrixAt(i, o.matrix); });
  scene.add(hexMain); envScene.add(hexEnv);
  // frame around the honeycomb
  const pad = 0.28, fx0 = minX - pad, fx1 = maxX + pad, fz0 = minZ - pad, fz1 = maxZ + pad;
  const frame = [[(fx0 + fx1) / 2, fz0, fx1 - fx0, 0], [(fx0 + fx1) / 2, fz1, fx1 - fx0, 0], [fx0, (fz0 + fz1) / 2, fz1 - fz0, 1], [fx1, (fz0 + fz1) / 2, fz1 - fz0, 1]];
  const frameM = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 2.4) }), frameE = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 7) });
  for (const [x, z, len, rot] of frame) {
    const g = new THREE.BoxGeometry(len + 0.045, 0.03, 0.05);
    for (const [sc, m] of [[scene, frameM], [envScene, frameE]]) { const b = new THREE.Mesh(g, m); b.position.set(x, Y, z); b.rotation.y = rot ? Math.PI / 2 : 0; sc.add(b); }
  }
  // housings above the light bars
  const hous = new THREE.Mesh(new THREE.BoxGeometry(fx1 - fx0 + 0.3, 0.06, fz1 - fz0 + 0.3), new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 0.8 }));
  hous.position.set((fx0 + fx1) / 2, Y + 0.05, (fz0 + fz1) / 2); scene.add(hous);
  mood.push({ mats: [hexMain.material, frameM], base: new THREE.Color(1, 1, 1), hallo: new THREE.Color(1.0, 0.36, 0.07), k: 2.4, hk: 0.75 });
  mood.push({ mats: [hexEnv.material, frameE], base: new THREE.Color(1, 1, 1), hallo: new THREE.Color(1.0, 0.36, 0.07), k: 7, hk: 0.55 });

  // Wall light bars (they draw the long horizontal reflections on the doors)
  const wm = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 1.7) }), we = new THREE.MeshBasicMaterial({ color: hdr(0xffffff, 3.2) });
  const hb = new THREE.BoxGeometry(15, 0.04, 0.03), vb = new THREE.BoxGeometry(0.03, 3.1, 0.04);
  for (const sz of [-1, 1]) for (const y of [0.4, 1.15, 2.45]) for (const [sc, m] of [[scene, wm], [envScene, we]]) { const b = new THREE.Mesh(hb, m); b.position.set(0, y, sz * (ROOM.z - 0.03)); sc.add(b); }
  for (const sx of [-1, 1]) for (const z of [-6, -3, 0, 3, 6]) for (const [sc, m] of [[scene, wm], [envScene, we]]) { const b = new THREE.Mesh(vb, m); b.rotation.y = Math.PI / 2; b.position.set(sx * (ROOM.x - 0.03), 1.95, z); sc.add(b); }
  mood.push({ mats: [wm], base: new THREE.Color(1, 1, 1), hallo: new THREE.Color(0.55, 0.12, 1.0), k: 1.7, hk: 0.95 });
  mood.push({ mats: [we], base: new THREE.Color(1, 1, 1), hallo: new THREE.Color(0.55, 0.12, 1.0), k: 3.2, hk: 0.8 });

  // Wall sign
  const signTex = canvasTex(2048, 420, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '400 230px "Bodoni Moda", Didot, "Times New Roman", serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '18px';
    ctx.fillText('TO THE MAX', w / 2, h * 0.42);
    ctx.font = '500 54px "IBM Plex Mono", monospace'; if ('letterSpacing' in ctx) ctx.letterSpacing = '34px';
    ctx.fillText('THE GARAGE', w / 2, h * 0.86);
  });
  const signM = new THREE.MeshBasicMaterial({ map: signTex, transparent: true, color: hdr(0xffffff, 1.6) });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 1.31), signM);
  sign.position.set(0, 3.35, -ROOM.z + 0.04); scene.add(sign);
  const signE = new THREE.Mesh(sign.geometry, new THREE.MeshBasicMaterial({ map: signTex, transparent: true, color: hdr(0xffffff, 2) }));
  signE.position.copy(sign.position); envScene.add(signE);
  mood.push({ mats: [signM], base: new THREE.Color(1, 1, 1), hallo: new THREE.Color(1, 0.45, 0.1), k: 1.6, hk: 1.6 });

  // Floor: true reflection under a semi-transparent tiled epoxy layer
  const mirror = new Reflector(new THREE.PlaneGeometry(ROOM.x * 2, ROOM.z * 2), {
    textureWidth: Math.round(innerWidth * DPR * RQ), textureHeight: Math.round(innerHeight * DPR * RQ), color: 0x8a8a8a, clipBias: 0.003
  });
  mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
  const tile = canvasTex(1024, 1024, (ctx, w, h) => {
    const r = rng(7); ctx.fillStyle = '#1c1d20'; ctx.fillRect(0, 0, w, h);
    const n = 4, t = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const v = 30 + r() * 6; ctx.fillStyle = `rgb(${v},${v + 1},${v + 4})`; ctx.fillRect(i * t + 4, j * t + 4, t - 8, t - 8);
      for (let k = 0; k < 900; k++) { const a = r() * 0.06; ctx.fillStyle = `rgba(${r() > .5 ? 255 : 0},${r() > .5 ? 255 : 0},${r() > .5 ? 255 : 0},${a})`; ctx.fillRect(i * t + 4 + r() * (t - 8), j * t + 4 + r() * (t - 8), 2, 2); }
    }
  });
  tile.wrapS = tile.wrapT = THREE.RepeatWrapping; tile.repeat.set(ROOM.x, ROOM.z);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x * 2, ROOM.z * 2), new THREE.MeshStandardMaterial({ map: tile, roughness: 0.32, metalness: 0, transparent: true, opacity: 0.78 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = 0.002; floor.receiveShadow = true; scene.add(floor);

  // Soft contact shadow under the car
  const ao = canvasTex(512, 256, (ctx, w, h) => {

  const fogT = canvasTex(512, 512, (ctx, w, h) => { const r2 = rng(5); ctx.clearRect(0, 0, w, h); for (let i = 0; i < 40; i++) { const x = w * (0.2 + r2() * 0.6), y = h * (0.2 + r2() * 0.6), rr = 40 + r2() * 140, g = ctx.createRadialGradient(x, y, 0, x, y, rr); g.addColorStop(0, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); } });

  }
}

/* =========================================================================
   Lighting, environment, post
   ========================================================================= */
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(1.0, 9, 1.5); sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048); sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4; sun.shadow.camera.near = 4; sun.shadow.camera.far = 12;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 7;
scene.add(sun);
const cubeRT = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.1, 60, cubeRT); cubeCam.position.set(0, 0.9, 0);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function updateEnv() { cubeCam.update(renderer, envScene); envRT = pmrem.fromCubemap(cubeRT.texture, envRT || undefined); scene.environment = envRT.texture; }

const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================================================
   State, UI, animation
   ========================================================================= */
const state = { paint: 'garnet', style: 'factory', black: false, hallo: false, lights: true };
const anim = { hallo: 0, lights: 1 };
const paintTarget = { color: new THREE.Color(PAINTS.garnet.hex), metal: PAINTS.garnet.metal, rough: PAINTS.garnet.rough };
const rimTarget = { color: new THREE.Color(STYLES.stock.finish.hex), metal: STYLES.stock.finish.metal, rough: STYLES.stock.finish.rough };
let swap = null, tween = null, envDirty = true, shadowDirty = true, userTouched = false;

function setRimTarget() {
  const f = state.black ? { hex: '#0a0a0b', metal: 0.35, rough: 0.2 } : STYLES[state.style].finish;
  rimTarget.color.set(f.hex); rimTarget.metal = f.metal; rimTarget.rough = f.rough;
}
function setPaint(k) {
  state.paint = k; const p = PAINTS[k]; paintTarget.color.set(p.hex); paintTarget.metal = p.metal; paintTarget.rough = p.rough;
  document.getElementById('paintName').textContent = p.name;
  document.querySelectorAll('.sw-btn').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
function setStyle(k) {
  if (k === state.style || swap) return; state.style = k; swap = { t: 0, done: false };
  document.querySelectorAll('.wh-btn').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
const VIEWS = {
  hero: { label: 'Hero', pos: [5.7, 1.4, 4.9], tgt: [0.1, 0.55, 0] },
  front: { label: 'Front', pos: [6.4, 0.95, 0.02], tgt: [0, 0.55, 0] },
  side: { label: 'Side', pos: [0.02, 1.0, 6.4], tgt: [0, 0.6, 0] },
  rear: { label: 'Rear', pos: [-4.9, 1.3, -3.9], tgt: [-0.2, 0.62, 0] },
  high: { label: 'High', pos: [3.6, 3.1, 3.0], tgt: [0, 0.45, 0] },
  wheel: { label: 'Wheel', pos: [2.4, 0.5, 2.35], tgt: [1.445, 0.36, 0.85] },
  hood: { label: 'Hood', pos: [3.9, 2.05, 1.3], tgt: [1.3, 0.85, 0] },
};
function flyTo(v, dur = 1.6) {
  const p1 = new THREE.Vector3(...v.pos), t1 = new THREE.Vector3(...v.tgt);
  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const s1 = new THREE.Spherical().setFromVector3(p1.clone().sub(t1));
  let dth = s1.theta - s0.theta; while (dth > Math.PI) dth -= 2 * Math.PI; while (dth < -Math.PI) dth += 2 * Math.PI;
  tween = { k: 0, dur, s0, s1, dth, t0: controls.target.clone(), t1 };
}
function buildUI() {
  const pe = document.getElementById('paints');
  for (const k in PAINTS) { const b = document.createElement('button'); b.className = 'sw-btn'; b.dataset.k = k; b.title = PAINTS[k].name; b.style.background = `radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 45%), ${PAINTS[k].hex}`; b.onclick = () => setPaint(k); pe.appendChild(b); }
  const we = document.getElementById('wheels');
  for (const k in STYLES) { const b = document.createElement('button'); b.className = 'wh-btn'; b.dataset.k = k; b.innerHTML = `${STYLES[k].label}<small>${STYLES[k].sub}</small>`; b.onclick = () => setStyle(k); we.appendChild(b); }
  const ve = document.getElementById('views');
  for (const k in VIEWS) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = VIEWS[k].label; b.onclick = () => { stopSpin(); flyTo(VIEWS[k]); }; ve.appendChild(b); }
  setPaint('garnet');
  document.querySelector('.wh-btn[data-k="factory"]').classList.add('on');
  const swBlack = document.getElementById('swBlack'), swHallo = document.getElementById('swHallo'), swLights = document.getElementById('swLights'), swSpin = document.getElementById('swSpin');
  swBlack.onchange = () => { state.black = swBlack.checked; setRimTarget(); };
  swHallo.onchange = () => { state.hallo = swHallo.checked; document.body.classList.toggle('hallo', state.hallo); hallo.spider.root.visible = true; shadowDirty = true; };
  swLights.onchange = () => { state.lights = swLights.checked; };
  swSpin.onchange = () => { controls.autoRotate = swSpin.checked; };
  document.getElementById('snap').onclick = () => {
    composer.render(); const a = document.createElement('a'); a.download = 'maxs-mustang.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click();
  };
  addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') swHallo.click();
    if (e.key === 'b' || e.key === 'B') swBlack.click();
    if (e.key === 'l' || e.key === 'L') swLights.click();
  });
  controls.addEventListener('start', () => { userTouched = true; stopSpin(); tween = null; });
}
function stopSpin() { controls.autoRotate = false; document.getElementById('swSpin').checked = false; }

function applyMood(h) {
  for (const m of mood) { const c = new THREE.Color().lerpColors(m.base, m.hallo, h).multiplyScalar(lerp(m.k, m.k * m.hk, h)); m.mats.forEach(x => x.color.copy(c)); }
  sun.intensity = lerp(1.0, 0.3, h); sun.color.setRGB(1, lerp(1, 0.6, h), lerp(1, 0.4, h));
  scene.fog.density = 0.028 * h;
  envDirty = true;
}
function viewOffset() {
  const wide = innerWidth > 820;
  camera.fov = camera.aspect < 0.8 ? 50 : 32;
  if (wide) camera.setViewOffset(innerWidth, innerHeight, 165, 0, innerWidth, innerHeight);
  else camera.setViewOffset(innerWidth, innerHeight, 0, Math.round(innerHeight * 0.17), innerWidth, innerHeight);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; viewOffset(); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
  studio.mirror.getRenderTarget().setSize(Math.round(innerWidth * DPR * RQ), Math.round(innerHeight * DPR * RQ));
});

const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function keepCamera() {
  const p = camera.position, t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -2, 2); t.z = THREE.MathUtils.clamp(t.z, -1, 1); t.y = THREE.MathUtils.clamp(t.y, 0.2, 1.4);
  const inside = () => Math.abs(p.x) < 2.75 && Math.abs(p.z) < 1.25 && p.y < 1.6;
  if (inside()) { tmpV.copy(p).sub(t).normalize(); for (let i = 0; i < 80 && inside(); i++) p.addScaledVector(tmpV, 0.04); }
  if (p.y > 3.25) { tmpV.copy(p).sub(t); tmpV.multiplyScalar((3.25 - t.y) / Math.max(0.01, tmpV.y)); p.copy(t).add(tmpV); }
  p.x = THREE.MathUtils.clamp(p.x, -11, 11); p.z = THREE.MathUtils.clamp(p.z, -9, 9); if (p.y < 0.12) p.y = 0.12;
}
function tick(manual) {

  if (manual === true) clock.elapsedTime += dt;
  const t = clock.elapsedTime;
  // paint and rim blending
  const kp = 1 - Math.exp(-dt * 5);
  for (const m of [bodyMat, paintPlain]) { m.color.lerp(paintTarget.color, kp); m.metalness = lerp(m.metalness, paintTarget.metal, kp); m.roughness = lerp(m.roughness, paintTarget.rough, kp); }
  rimMat.color.lerp(rimTarget.color, kp); rimMat.metalness = lerp(rimMat.metalness, rimTarget.metal, kp); rimMat.roughness = lerp(rimMat.roughness, rimTarget.rough, kp);
  // wheel swap: spin the wheels and change the face halfway
  if (swap) {
    swap.t += dt / 0.8; const e = ease(Math.min(1, swap.t));
    wheels.forEach(w => w.spin.rotation.z = e * Math.PI * 2);
    if (!swap.done && swap.t > 0.5) { applyWheelStyle(); setRimTarget(); swap.done = true; shadowDirty = true; }
    if (swap.t >= 1) { wheels.forEach(w => w.spin.rotation.z = 0); swap = null; shadowDirty = true; }
  }
  // Halloween blend
  const hT = state.hallo ? 1 : 0;
  if (Math.abs(anim.hallo - hT) > 0.001) {
    anim.hallo += Math.sign(hT - anim.hallo) * Math.min(Math.abs(hT - anim.hallo), dt / 1.1);
    const h = ease(anim.hallo);
    hallo.fadeMats.forEach(m => m.opacity = h * m.userData.max);
    hallo.group.visible = anim.hallo > 0.001;
    hallo.pumpkins.forEach((g, i) => { const s = Math.max(0.0001, ease(clamp01(anim.hallo * 1.4 - i * 0.07)) * g.userData.sc); g.scale.setScalar(s); });
    hallo.fog.forEach(m => m.material.opacity = 0.09 * h);
    hallo.spider.root.visible = anim.hallo > 0.02;
    applyMood(h);
    if (Math.abs(anim.hallo - hT) <= 0.001) shadowDirty = true;
  }
  if (anim.hallo > 0.001) {
    const h = ease(anim.hallo);
    hallo.lights.forEach((L, i) => { const fl = 0.75 + 0.25 * Math.sin(t * 13 + i * 2.1) * Math.sin(t * 7.3 + i) + 0.1 * Math.sin(t * 31 + i * 5); L.intensity = 2.6 * fl * h; });
    hallo.pmat.emissiveIntensity = 2.2 * h * (0.85 + 0.15 * Math.sin(t * 17));
    const sp = hallo.spider, drop = 0.16 + 0.05 * Math.sin(t * 1.3) * h;

  }

  lightsFx.tail.forEach(m => m.emissiveIntensity = (m.userData.base ?? 3) * (0.12 + 0.88 * anim.lights));
  lightsFx.spots.forEach(s => s.intensity = 6 * anim.lights);

  if (tween) {
    tween.k += dt / tween.dur; const e = ease(Math.min(1, tween.k));
    const th = tween.s0.theta + tween.dth * e, ph = lerp(tween.s0.phi, tween.s1.phi, e), rr = lerp(tween.s0.radius, tween.s1.radius, e);

    camera.position.setFromSpherical(new THREE.Spherical(rr, ph, th)).add(controls.target);

  }

  keepCamera();
  if (envDirty) { updateEnv(); envDirty = false; }
  if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  composer.render();
  if (manual !== true) requestAnimationFrame(tick);
}

/* =========================================================================
   Boot
   ========================================================================= */
async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load('230px "Bodoni Moda"'), document.fonts.load('54px "IBM Plex Mono"')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  await step(12, 'Hanging the honeycomb lights');
  studio = buildStudio();
  await step(30, 'Rolling the Mustang in');
  await buildRealCar();
  await step(62, 'Mounting the wheels');
  buildWheels();
  modelRims.forEach(o => o.material = rimMat);
  await step(78, 'Dressing it for Halloween');
  buildHalloween();
  hallo.group.visible = false;
  await step(92, 'Polishing the clear coat');
  buildUI();
  camera.aspect = innerWidth / innerHeight; viewOffset(); camera.updateProjectionMatrix();
  updateEnv(); renderer.shadowMap.needsUpdate = true;
  composer.render();
  await step(100, 'Ready');
  const L = document.getElementById('loader'); L.style.opacity = 0; setTimeout(() => L.remove(), 1000);
  flyTo(VIEWS.hero, 2.6);
  window.__ready = true;
  requestAnimationFrame(tick);
}
boot().catch(e => { document.getElementById('err').textContent = 'Error: ' + (e.stack || e); console.error(e); });
window.__dbg = { get wheels() { return wheels; }, get spots() { return realSpots; }, get mw() { return modelWheels; }, section, JD, JG, JT, JC, THREE, scene, camera, controls, state, setPaint, setStyle, flyTo, VIEWS, renderer, composer, get body() { return body; },
  // manual stepping for headless checks (rAF is paused in hidden tabs)
  frames(n = 1, dt = 1 / 30) { tick.dt = dt; for (let i = 0; i < n; i++) tick(true); return n; },
  async views(list) { controls.autoRotate = false; tween = null; const out = {}; for (const [name, p, t] of list) { controls.target.set(...t); camera.position.set(...p); controls.update(); this.frames(1); composer.render(); const d = renderer.domElement.toDataURL('image/jpeg', 0.88); await fetch('/' + name + '.jpg', { method: 'POST', body: d }).catch(() => {}); out[name] = d.length; } return out; } };
</script>
